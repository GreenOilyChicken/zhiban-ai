spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zhiban_ai}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}  # 必须通过环境变量注入，禁止硬编码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT 配置 - 密钥必须通过环境变量注入，禁止硬编码默认值
jwt:
  secret: ${JWT_SECRET}  # 生产环境必须注入，不提供默认值
  expiration: 86400000   # 24小时（毫秒）

# RAG 配置
rag:
  top-k: 5               # 向量检索返回Top-K结果
  score-threshold: 0.75   # 相似度分数阈值
  vector-api-url: ${RAG_VECTOR_API_URL:http://localhost:8081/api/v1/search}
  api-key: ${RAG_API_KEY:}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.zhiban.ai: debug
    org.springframework.security: info
