spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zhiban_ai}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}  # 必须通过环境变量注入，禁止硬编码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 文件上传大小限制
  # 附件一 §3.3 语音识别需支持 10MB 音频；§4.2 知识库文档上传上限 5MB。
  # Spring 默认仅 1MB，若不显式配置，超限会抛 MaxUploadSizeExceededException 并返回 500。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT 配置 - 密钥必须通过环境变量注入，禁止硬编码默认值
jwt:
  secret: ${JWT_SECRET}  # 生产环境必须注入，不提供默认值
  expiration: 86400000   # 24小时（毫秒）

# 敏感数据加密（附件一 §8.1：手机号须加密存储）
# 未注入时退化为明文存储并打印告警，保证开发环境可用；生产环境必须注入。
security:
  phone:
    encryption-key: ${PHONE_ENC_KEY:}
    blind-index-key: ${PHONE_INDEX_KEY:}

# RAG 配置
rag:
  top-k: 5               # 向量检索返回Top-K结果
  score-threshold: 0.75   # 相似度分数阈值
  vector-api-url: ${RAG_VECTOR_API_URL:http://localhost:8081/api/v1/search}
  api-key: ${RAG_API_KEY:}

# Python AI 智能体服务（附件一 §2.1：AI 层独立部署）
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8081}
  timeout-ms: ${AI_SERVICE_TIMEOUT_MS:60000}
  connect-timeout-ms: 5000
  api-key: ${AI_SERVICE_API_KEY:}

# 接口频率限制（附件一 §3.6：429 限流）
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  max-requests: ${RATE_LIMIT_MAX:300}   # 每窗口最大请求数
  window-ms: ${RATE_LIMIT_WINDOW_MS:60000}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.zhiban.ai: debug
    org.springframework.security: info
