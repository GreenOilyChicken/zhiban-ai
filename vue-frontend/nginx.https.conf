# ═══════════════════════════════════════════════════════
# 知伴AI — Nginx HTTPS/TLS 配置（可选启用，覆盖 default.conf）
# ═══════════════════════════════════════════════════════
#
# 本文件【不随镜像默认加载】。默认部署仍然使用 nginx.conf（仅 80，HTTP），
# 因此 `docker compose up` 在没有证书的情况下可以正常启动。
#
# 启用方式（详见 DEPLOYMENT.md §11）：
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# 证书路径约定（容器内 /etc/nginx/certs/，由 ./certs 只读挂载）：
#   /etc/nginx/certs/server.crt   证书（自签名证书；Let's Encrypt 用 fullchain.pem 改名）
#   /etc/nginx/certs/server.key   私钥（务必 chmod 600，切勿提交仓库）
#
# 生成自签名证书：bash scripts/gen-self-signed-cert.sh
#
# 依赖：nginx >= 1.25.1（`http2 on;` 指令）。若使用更早版本，
#       删除下面的 `http2 on;` 行即可退回 HTTP/1.1，其余配置不变。
#
# ⚠️ 本文件与 nginx.conf 保持行为一致：location /、location /api/、
#    静态资源缓存、安全头、gzip 规则均逐条对应（见文件末尾对照说明）。
# ═══════════════════════════════════════════════════════

# ── 80：仅保留健康检查，其余全部跳转 443 ────────────────
server {
    listen 80;
    server_name _;

    # 容器 HEALTHCHECK 走 http://localhost/healthz，避免被 301 带到 TLS 校验上。
    # 该端点同时保留在 443 server 中，HTTP/HTTPS 两种探针都能通过。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 其余请求永久跳转到 HTTPS（附件一 §10.3：传输使用 HTTPS）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443：TLS 终结 + 前端静态文件 + API 反代 ─────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── 证书 ────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ── 协议与套件（附件一 §10.3：TLS 1.2 / 1.3）────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 会话复用（降低握手开销）
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling：仅正式证书（Let's Encrypt/商业证书）需要，
    # 自签名证书无 OCSP 响应方，保持关闭以免日志告警。启用时取消注释：
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/certs/server.crt;
    # resolver 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
    # resolver_timeout 5s;

    # ── 健康检查（供容器 HEALTHCHECK 的 HTTPS 探针使用）──
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── 前端静态文件 ────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── API 代理到 Java 后端 ────────────────────────────
    location /api/ {
        proxy_pass http://java-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # WebSocket 支持（未来扩展用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 静态资源缓存 ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 安全头 ──────────────────────────────────────────
    # 注意（沿用 nginx.conf 的既有行为）：nginx 的 add_header 不会被下层
    # location 继承——只要该 location 自己写了 add_header。上面静态资源
    # location 自带 Cache-Control，因此不会带上这几个安全头。此处保持与
    # nginx.conf 完全一致，未做行为变更。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── HSTS（附件一 §10.3）─────────────────────────────
    # 仅在 HTTPS 响应上发送。确认所有子域都已支持 HTTPS 后，
    # 可升级为 "max-age=31536000; includeSubDomains; preload"。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── gzip 压缩 ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
}
