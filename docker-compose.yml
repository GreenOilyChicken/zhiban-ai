# ═══════════════════════════════════════════════════════
# 知伴AI — Docker Compose 一体化部署配置
# ═══════════════════════════════════════════════════════
#
# 使用方法：
#   1. 复制 .env.docker.example 为 .env.docker，填写 API Key 等配置
#   2. 执行一键启动脚本：./start.sh (Linux) 或 start.ps1 (Windows)
#   3. 或手动执行：docker compose --env-file .env.docker up -d
#
# 服务端口映射：
#   前端 (Nginx)  : http://localhost
#   Java 后端     : http://localhost:8080
#   Python RAG    : http://localhost:8081
#   MySQL         : localhost:3306
#
# ── HTTPS / TLS（可选，生产必需）─────────────────────────
# 本文件默认只监听 80（HTTP），无需证书即可启动，适合开发环境。
# 需要 443/TLS 时，叠加 docker-compose.https.yml（附件一 §9.2 / §10.3）：
#   1) bash scripts/gen-self-signed-cert.sh -d your-domain.com
#      （生产请改用 Let's Encrypt / 商业证书，见 DEPLOYMENT.md §11）
#   2) docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# 详细说明见 DEPLOYMENT.md §11「HTTPS / TLS 部署」。
# ═══════════════════════════════════════════════════════

version: "3.8"

services:
  # ── MySQL 数据库 ──────────────────────
  mysql:
    image: mysql:8.0
    container_name: zhiban-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-zhiban123}
      MYSQL_DATABASE: zhiban_ai
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=256M
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./java-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-zhiban123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - zhiban-net

  # ── Python AI + RAG 检索服务 ─────────
  python-ai:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: zhiban-python-ai
    restart: unless-stopped
    environment:
      # LLM 配置
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      # CodeBuddy 本地代理（仅开发联调）
      CODEBUDDY_API_KEY: ${CODEBUDDY_API_KEY:-}
      CODEBUDDY_BASE_URL: ${CODEBUDDY_BASE_URL:-http://host.docker.internal:3800/v1}
      CODEBUDDY_MODEL: ${CODEBUDDY_MODEL:-deepseek-v4-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      # Embedding 配置
      # 生产用 bge：模型文件随镜像分发（客户环境无外网，不能在线下载）。
      # BGE_MODEL_DIR 指向容器内路径；如需更换模型（如 bge-m3）改此变量即可。
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge}
      BGE_MODEL_DIR: ${BGE_MODEL_DIR:-/app/models/bge-small-zh-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      # 语音（TTS/ASR）：留空走内置 edge-tts / whisper
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_NLS_APP_KEY: ${ALIYUN_NLS_APP_KEY:-}
      ALIYUN_NLS_TOKEN: ${ALIYUN_NLS_TOKEN:-}
      ASR_MODEL: ${ASR_MODEL:-small}
      # RAG 服务配置
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8081
      # 知识库路径
      KB_POLICY_DIR: /app/knowledge_base/policies
      KB_ELDERLY_DIR: /app/knowledge_base/elderly
      KB_TOURISM_DIR: /app/knowledge_base/tourism
      KB_CHROMA_DIR: /app/knowledge_base/chroma_db
      LEDGER_OUTPUT_DIR: /app/output/ledgers
      LTC_LOG_MASK: "true"
    ports:
      - "8081:8081"
    volumes:
      # 知识库源文件（只读挂载）
      - ./python/knowledge_base:/app/knowledge_base
      # ChromaDB 持久化（可读写）
      - chroma_data:/app/knowledge_base/chroma_db
      # 台账输出
      - ./python/output:/app/output
      # HuggingFace 模型缓存（避免每次重建容器重新下载）
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - zhiban-net

  # ── Java Spring Boot 后端 ─────────────
  java-backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: zhiban-java-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      python-ai:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: zhiban_ai
      DB_USERNAME: root
      # 安全：不提供默认值，未注入即启动失败（避免弱口令上线）
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必须通过 .env.docker 注入}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须通过 .env.docker 注入}
      # 敏感数据加密（附件一 §8.1：手机号须加密存储）
      # 留空则退化为明文并打印告警；生产环境务必注入
      PHONE_ENC_KEY: ${PHONE_ENC_KEY:-}
      PHONE_INDEX_KEY: ${PHONE_INDEX_KEY:-}
      # Python AI 智能体服务（附件一 §2.1 AI 层独立部署）
      AI_SERVICE_URL: http://python-ai:8081
      AI_SERVICE_API_KEY: ${RAG_API_KEY:-}
      RAG_VECTOR_API_URL: http://python-ai:8081/api/v1/search
      RAG_API_KEY: ${RAG_API_KEY:-}
      # 接口限流（附件一 §3.6）
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/help/articles?page=1&size=1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - zhiban-net

  # ── Vue.js 前端 + Nginx 反向代理 ─────
  vue-frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
    container_name: zhiban-vue-frontend
    restart: unless-stopped
    depends_on:
      java-backend:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - zhiban-net

# ── 持久化卷 ────────────────────────────
volumes:
  mysql_data:
    name: zhiban-mysql-data
  chroma_data:
    name: zhiban-chroma-data
  hf_cache:
    name: zhiban-hf-cache

# ── 网络 ────────────────────────────────
networks:
  zhiban-net:
    name: zhiban-net
    driver: bridge
